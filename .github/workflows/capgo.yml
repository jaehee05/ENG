name: Capgo Deploy

# main 에 코드가 푸시되면 자동으로 버전 patch 올리고 빌드해서
# Capgo production 채널에 새 번들을 업로드한다.
# 필요한 것: 저장소 Secrets 에 CAPGO_API_KEY 1개.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
  # 시크릿 추가 후 현재 상태를 수동으로 한 번 배포할 때 사용
  workflow_dispatch:

# 버전 bump + commit-back 이 동시에 겹치지 않게 직렬화
concurrency:
  group: capgo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 시크릿이 없으면 (예: 포크) 조용히 건너뜀
    if: ${{ github.repository == 'jaehee05/eng' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # commit-back 푸시 권한
          token: ${{ secrets.GITHUB_TOKEN }}
          # 트리거된 커밋이 아니라 지금의 main 을 받는다.
          #
          # 기본값(트리거 SHA)이면 앞 배포가 올려놓은 버전 범프가 빠진 상태로
          # 시작한다. PR 을 연달아 머지하면 뒤 런이 앞 런과 같은 버전을 다시
          # 올리려다 "Version already exists" 로 죽는다 (2026-08-02 에 세 개를
          # 연달아 머지하다 겪음 — 배포 3개 중 1개만 나갔다).
          #
          # concurrency 로 직렬화돼 있으니 앞 런이 끝난 뒤 main 을 받는 게 맞다.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm install

      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      - name: Build web bundle
        run: npm run build

      - name: Upload bundle to Capgo (production)
        env:
          CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
        run: |
          if [ -z "$CAPGO_API_KEY" ]; then
            echo "::error::CAPGO_API_KEY 시크릿이 설정되지 않았습니다. 저장소 Settings > Secrets > Actions 에 추가하세요."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "Uploading bundle $VERSION ..."
          # CLI 8.9.x 에 auth 버그(Invalid API key) 가 있어 항상 latest 사용. package.json 잠금 무시.
          # --channel production 이 붙어 있어 이 명령만으로 production 채널까지 지정된다.
          npx --yes @capgo/cli@latest bundle upload --apikey "$CAPGO_API_KEY" --channel production

          # 아래 channel set 은 위 업로드가 이미 한 일을 한 번 더 확인하는 안전장치다.
          # 실패해도 배포는 이미 끝난 상태이므로 잡을 실패시키지 않는다.
          #
          # 실패시키면 안 되는 이유(2026-07-28 실제로 겪음): 이 단계에서 죽으면
          # 뒤의 "Commit version bump" 가 skip 되어 package.json 이 안 올라간다.
          # 그러면 다음 배포가 같은 버전을 다시 올리려다 "Version already exists"
          # 로 막혀, 실제로는 성공한 배포 하나 때문에 이후 배포가 전부 깨진다.
          if ! npx --yes @capgo/cli@latest channel set production --bundle "$VERSION" --apikey "$CAPGO_API_KEY"; then
            echo "::warning::channel set 실패 — 업로드 단계에서 이미 production 채널이 지정됐다면 배포는 정상입니다. Capgo 대시보드에서 production 채널이 $VERSION 인지 확인하세요. (API 키 권한 문제일 수 있음)"
          fi

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "버전 변경 없음 — 커밋 생략"
          else
            git commit -m "chore: bump version for Capgo release [skip ci]"
            # 번들은 이미 Capgo 에 올라갔다. 여기서 죽으면 package.json 만
            # 뒤처져 다음 배포가 같은 버전을 다시 올리려다 깨진다. 그 사이
            # main 이 움직였으면 받아서 얹고 다시 민다.
            git push || (git pull --rebase origin main && git push)
          fi
